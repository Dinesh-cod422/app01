<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7320845599419472"
     crossorigin="anonymous"></script>
  <title>Personality Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      text-align: center;
    }
    .form-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      width: 300px;
      text-align: center;
    }
    input {
      width: 90%;
      margin: 8px 0;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 10px;
      padding: 8px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .result-card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      text-align: left;
    }
    .tag {
      display: inline-block;
      background: #e1ecf4;
      color: #0366d6;
      font-size: 12px;
      margin: 2px;
      padding: 3px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>🔮 Personality Generator</h1>

  <div class="form-box">
    <input type="text" id="nameInput" placeholder="Enter Name">
    <input type="date" id="dobInput">
    <button onclick="generatePersonality()">Generate</button>
  </div>

  <div id="result"></div>

  <script>
    const strengths = ["Creative","Kind","Hardworking","Adventurous","Curious","Calm","Confident","Reliable"];
    const weaknesses = ["Impatient","Forgetful","Overthinker","Lazy","Moody","Shy","Impulsive","Stubborn"];
    const hobbies = ["Reading","Singing","Traveling","Gaming","Cooking","Drawing","Dancing","Photography"];
    const nicknames = ["Rocky","Sunny","Momo","Choco","Star","Buddy","Zippy","Ninja"];
    const personalities = ["Serious","Funny","Calm","Energetic","Mysterious"];

    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generatePersonality() {
      const name = document.getElementById("nameInput").value.trim();
      const dob = document.getElementById("dobInput").value;

      if (!name || !dob) {
        alert("Please enter both Name and Date of Birth");
        return;
      }

      const result = {
        name,
        date_of_birth: dob,
        personality: getRandom(personalities),
        strengths: [getRandom(strengths), getRandom(strengths)],
        weaknesses: [getRandom(weaknesses), getRandom(weaknesses)],
        hobby: getRandom(hobbies),
        fun_fact: `Loves to eat ${getRandom(["chocolate", "pizza", "mangoes", "ice cream", "noodles"])} at midnight.`,
        nickname: getRandom(nicknames)
      };

      displayResult(result);
    }

    function displayResult(profile) {
      const container = document.getElementById("result");
      container.innerHTML = `
        <div class="result-card">
          <h2>${profile.name} (${profile.nickname})</h2>
          <p><strong>Date of Birth:</strong> ${profile.date_of_birth}</p>
          <p><strong>Personality:</strong> ${profile.personality}</p>
          <p><strong>Strengths:</strong> ${profile.strengths.map(s => `<span class="tag">${s}</span>`).join(" ")}</p>
          <p><strong>Weaknesses:</strong> ${profile.weaknesses.map(w => `<span class="tag">${w}</span>`).join(" ")}</p>
          <p><strong>Hobby:</strong> ${profile.hobby}</p>
          <p><em>${profile.fun_fact}</em></p>
        </div>
      `;
    }
  </script>
</body>
</html>
